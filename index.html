<!doctype html><html lang='pt-BR'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Anjo Branco</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<style>:root{--p:#003366;--bg:#f8fafc;--b:#e2e8f0}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:var(--bg)}.hidden{display:none!important}.app{display:flex;min-height:100vh}.side{width:260px;background:var(--p);color:#fff;position:fixed;inset:0 auto 0 0;padding:14px;display:flex;flex-direction:column}.main{margin-left:260px;padding:14px;width:calc(100% - 260px)}.item{display:flex;gap:8px;align-items:center;padding:10px;border-radius:8px;cursor:pointer}.item:hover,.item.active{background:#ffffff22}.sub{padding-left:20px}.card{background:#fff;border:1px solid var(--b);border-radius:12px;padding:12px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.wrap{margin-top:10px;background:#fff;border:1px solid var(--b);border-radius:12px;padding:10px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #eee}.badge{padding:2px 8px;border-radius:10px;font-size:12px}.nt{background:#fff3e0;color:#ef6c00}.fi{background:#e8f5e9;color:#2e7d32}.ag{background:#ffe0b2;color:#e65100}.btn{border:0;padding:9px 12px;border-radius:8px;cursor:pointer}.p{background:var(--p);color:#fff}.a{background:#ff6f00;color:#fff}.plate{font-family:monospace;background:#111;color:#fff;padding:2px 6px;border-radius:6px}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center}.box{background:#fff;padding:12px;border-radius:12px;max-width:760px;width:95%;max-height:90vh;overflow:auto}.row{display:flex;gap:8px;flex-wrap:wrap}input,select,textarea{padding:9px;border:1px solid #ccc;border-radius:8px}.top{display:flex;justify-content:space-between;align-items:center}.dot{width:10px;height:10px;background:#18c964;border-radius:50%;display:inline-block;animation:p 1.2s infinite}@keyframes p{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}.login{min-height:100vh;display:grid;place-items:center}.log{background:#fff;padding:20px;border-radius:12px;width:min(380px,92vw)}@media(max-width:767px){.side{transform:translateX(-100%);transition:.2s}.side.open{transform:translateX(0)}.main{margin-left:0;width:100%}}</style></head>
<body>
<div id='login' class='login'><form id='fLogin' class='log'><h2>Anjo Branco</h2><input id='senha' type='password' placeholder='Senha mestra'><button class='btn p' style='width:100%;margin-top:8px'>Entrar</button><p id='e' style='color:#c00'></p></form></div>
<div id='app' class='app hidden'><aside id='side' class='side'><div class='top'><h2>Transportadora</h2><span class='material-symbols-outlined'>person</span></div><small>PORTARIA TO OPERATOR</small>
<div class='item active' data-v='dash'><span class='material-symbols-outlined'>dashboard</span>Dashboard</div>
<div class='item' data-v='port'><span class='material-symbols-outlined'>door_front</span>Lançar Portaria</div>
<div class='item' id='relBtn'><span class='material-symbols-outlined'>description</span>Relatórios</div>
<div id='relSub' class='hidden'>
<div class='item sub' data-v='aberto'>Viagens em Aberto</div><div class='item sub' data-v='encerrado'>Viagens Encerradas</div><div class='item sub' data-v='chegadas'>Chegadas da Semana</div><div class='item sub' data-v='motoraj'>Motorista/Ajudante</div></div>
<div class='item' data-v='frota'><span class='material-symbols-outlined'>local_shipping</span>Minha Frota</div>
<div class='item' data-v='cond'><span class='material-symbols-outlined'>person</span>Condutores</div>
<div class='item' data-v='conf'><span class='material-symbols-outlined'>settings</span>Configurações</div>
<div style='margin-top:auto'><small><span class='dot'></span> Online no Banco</small><button id='sair' class='btn' style='width:100%;margin-top:8px'>Sair</button></div></aside><main class='main'><div id='view'></div></main></div>
<div id='m' class='modal hidden'><div id='mb' class='box'></div></div>
<script>
const SENHA='Anjo@2026',K={log:'logado',reg:'portaria_registros',vei:'portaria_veiculos',con:'portaria_condutores',rot:'portaria_rotas',vig:'portaria_vigias',ope:'portaria_operacoes'};
const S={reg:[],vei:[],con:[],rot:[],vig:['Vigia 1'],ope:['BRF','ITALAC','JBS','BOI BRASIL','CANTO DE MINAS','AUREA','TOBRAGO','VIGOR','OUTRAS'],tab:'saida',sub:'Viagem'};
const $=i=>document.getElementById(i);const gid=()=>Date.now()+'_'+Math.random().toString(36).slice(2,7);
function init(){for(const [k,v] of [[K.reg,[]],[K.vei,[]],[K.con,[]],[K.rot,[]],[K.vig,S.vig],[K.ope,S.ope]]) if(!localStorage.getItem(k)) localStorage.setItem(k,JSON.stringify(v)); load(); auth();}
function load(){S.reg=JSON.parse(localStorage.getItem(K.reg)||'[]');S.vei=JSON.parse(localStorage.getItem(K.vei)||'[]');S.con=JSON.parse(localStorage.getItem(K.con)||'[]');S.rot=JSON.parse(localStorage.getItem(K.rot)||'[]');S.vig=JSON.parse(localStorage.getItem(K.vig)||'[]');S.ope=JSON.parse(localStorage.getItem(K.ope)||'[]')}
function save(){localStorage.setItem(K.reg,JSON.stringify(S.reg));localStorage.setItem(K.vei,JSON.stringify(S.vei));localStorage.setItem(K.con,JSON.stringify(S.con));localStorage.setItem(K.rot,JSON.stringify(S.rot));localStorage.setItem(K.vig,JSON.stringify(S.vig));localStorage.setItem(K.ope,JSON.stringify(S.ope))}
function auth(){const ok=localStorage.getItem(K.log)==='true';$('login').classList.toggle('hidden',ok);$('app').classList.toggle('hidden',!ok); if(ok)dash();}
$('fLogin').onsubmit=e=>{e.preventDefault();if($('senha').value===SENHA){localStorage.setItem(K.log,'true');auth()}else $('e').textContent='Senha incorreta'}; $('sair').onclick=()=>{localStorage.removeItem(K.log);auth()};
function km(r){return r.km_chegada!=null&&r.km_saida!=null?Number(r.km_chegada)-Number(r.km_saida):0}
function week(d){const x=new Date(d);const onejan=new Date(x.getFullYear(),0,1);return Math.ceil((((x-onejan)/86400000)+onejan.getDay()+1)/7)}
function badge(r){return r.status==='Finalizada'?"<span class='badge fi'>Finalizada</span>":"<span class='badge nt'>No Trecho</span>"}
function dash(){const open=S.reg.filter(r=>!r.data_chegada);$('view').innerHTML=`<div class='top'><h2>Visão Operacional - ${new Date().toLocaleDateString('pt-BR')}</h2><button class='btn p' onclick='port()'>Lançar</button></div><div class='row'><input id='de' type='date'><input id='ate' type='date'></div><div class='cards'><div class='card'>Total ${S.reg.length}</div><div class='card'>Km ${S.reg.reduce((a,r)=>a+km(r),0)}</div><div class='card'>Finalizadas ${S.reg.filter(r=>r.status==='Finalizada').length}</div><div class='card'>No Pátio ${open.length}</div></div><div class='wrap'><h3>Fluxo Recente</h3><table><tr><th>Horário</th><th>Placa</th><th>Motorista</th><th>Destino</th><th>Transporte</th><th>KM</th><th>Status</th></tr>${open.map(r=>`<tr><td>${new Date(r.data_saida).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</td><td><span class='plate'>${r.placa}</span></td><td>${(r.motorista||'').toUpperCase().slice(0,18)}</td><td>${r.rota||'-'}</td><td>${r.transporte||'-'}</td><td>${r.km_saida||'-'}</td><td>${badge(r)}</td></tr>`).join('')}</table></div>`}
function port(){const placas=S.vei.map(v=>v.placa);const rotas=S.rot.map(r=>r.nome);const cond=S.con.map(c=>c.nome);$('view').innerHTML=`<h2>Lançar Portaria</h2><div class='row'><button class='btn ${S.tab==='saida'?'p':''}' onclick='S.tab="saida";port()'>Saída</button><button class='btn ${S.tab==='chegada'?'p':''}' onclick='S.tab="chegada";port()'>Chegada</button></div><div class='row'><button class='btn ${S.sub==='Viagem'?'a':''}' onclick='S.sub="Viagem";port()'>Viagem</button><button class='btn ${S.sub==='Manutenção'?'a':''}' onclick='S.sub="Manutenção";port()'>Manutenção</button><button class='btn ${S.sub==='Abastecimento'?'a':''}' onclick='S.sub="Abastecimento";port()'>Abastecimento</button></div><div class='wrap'><div class='row'><input id='placa' list='lPlaca' placeholder='Placa'><datalist id='lPlaca'>${placas.map(p=>`<option>${p}</option>`).join('')}</datalist><select id='oper'>${S.ope.map(o=>`<option>${o}</option>`).join('')}</select><input id='kms' type='number' placeholder='KM Saída'></div><div class='row'><input id='rota' list='lRota' placeholder='Rota'><datalist id='lRota'>${rotas.map(r=>`<option>${r}</option>`).join('')}</datalist><input id='trans' type='number' maxlength='9' placeholder='Nº Transporte'><input id='mot' list='lCon' placeholder='Motorista'><datalist id='lCon'>${cond.map(c=>`<option>${c}</option>`).join('')}</datalist><input id='aju' placeholder='Ajudante'></div><div class='row'><select id='vig'>${S.vig.map(v=>`<option>${v}</option>`).join('')}</select><select id='car'><option>Com Carrinho</option><option>Sem Carrinho</option></select><input id='foto' type='file' accept='image/*' capture='environment'><input id='kme' type='number' placeholder='KM Chegada'></div><button class='btn p' onclick='salvarPort()'>Salvar ${S.tab==='saida'?'Saída':'Chegada'}</button></div>`; autoKm();}
function autoKm(){const p=$('placa');if(!p)return;p.onchange=()=>{const ult=[...S.reg].reverse().find(r=>r.placa===p.value&&(r.km_chegada!=null||r.km_saida!=null));if(ult)$('kms').value=ult.km_chegada??ult.km_saida??''}}
async function b64(f){return await new Promise(r=>{if(!f)return r('');const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)})}
async function salvarPort(){const placa=$('placa').value.trim().toUpperCase();if(!placa)return;const foto=await b64($('foto').files[0]); if(S.tab==='saida'){S.reg.push({id:gid(),data_saida:new Date().toISOString(),placa,operacao:$('oper').value,km_saida:Number($('kms').value)||null,rota:$('rota').value,transporte:$('trans').value,motorista:$('mot').value,ajudante:$('aju').value,vigia:$('vig').value,carrinho:$('car').value,foto_saida:foto,status:'Em Aberto',tipo_operacao:S.sub,observacoes:''});}
else {const r=[...S.reg].reverse().find(x=>x.placa===placa&&!x.data_chegada);if(r){r.data_chegada=new Date().toISOString();r.km_chegada=Number($('kme').value)||null;r.foto_chegada=foto;r.status='Finalizada';r.km_rodado=km(r);} }
save();dash();}
function tabelaRel(f){const regs=f(); return `<div class='wrap'><table><tr><th>Data/Hora</th><th>Semana</th><th>Placa</th><th>Motorista</th><th>KM</th><th>Carrinho</th><th>Mídia</th><th>Rota</th><th>Transporte</th><th>Hod.S</th><th>Hod.E</th></tr>${regs.map(r=>`<tr><td>S:${new Date(r.data_saida).toLocaleString('pt-BR')} ${r.data_chegada?'<br>E:'+new Date(r.data_chegada).toLocaleString('pt-BR'):''}</td><td>${week(r.data_chegada||r.data_saida)}</td><td>${r.placa}</td><td>${r.motorista||'-'}</td><td>${r.data_chegada?km(r):"<span class='badge ag'>AG. CHEG.</span>"}</td><td>S:${r.carrinho||'-'} E:${r.carrinho||'-'}</td><td>${r.foto_saida?'👁️':'-'}</td><td>${r.rota||'-'}</td><td>${r.transporte||'-'}</td><td>${r.km_saida||'-'}</td><td>${r.km_chegada||'-'}</td></tr>`).join('')}</table></div>`}
function aberto(){$('view').innerHTML='<h2>Viagens em Aberto</h2>'+tabelaRel(()=>S.reg.filter(r=>!r.data_chegada))}
function encerrado(){$('view').innerHTML='<h2>Viagens Encerradas</h2>'+tabelaRel(()=>S.reg.filter(r=>r.data_chegada))}
function chegadas(){$('view').innerHTML='<h2>Chegadas da Semana</h2>'+tabelaRel(()=>S.reg.filter(r=>r.data_chegada))}
function motoraj(){const regs=S.reg.filter(r=>r.data_saida);$('view').innerHTML=`<h2>Motorista/Ajudante</h2><div class='cards'><div class='card'>Total de Viagens ${regs.length}</div><div class='card'>Motoristas Únicos ${new Set(regs.map(r=>r.motorista)).size}</div></div><div class='wrap'><table><tr><th>Motorista</th><th>Ajudante</th><th>Placa</th><th>Data</th><th>Rota</th><th>Qtd</th></tr>${regs.map(r=>`<tr><td>${r.motorista||'-'}</td><td>${r.ajudante||'-'}</td><td>${r.placa}</td><td>${new Date(r.data_saida).toLocaleDateString('pt-BR')}</td><td>${r.rota||'-'}</td><td>1</td></tr>`).join('')}</table></div>`}
function frota(){ $('view').innerHTML=`<h2>Minha Frota</h2><button class='btn p' onclick='modalVei()'>+ Novo Veículo</button><div class='wrap'><table><tr><th>Placa</th><th>Tipo</th><th>Marca</th><th>Modelo</th><th>Utilização</th><th>Hodômetro</th><th>Ações</th></tr>${S.vei.map(v=>`<tr><td>${v.placa}</td><td>${v.tipo||''}</td><td>${v.marca||''}</td><td>${v.modelo||''}</td><td>${v.utilizacao||''}</td><td>${v.hodometro||0}</td><td><button onclick='modalVei("${v.placa}")'>✏️</button><button onclick='delVei("${v.placa}")'>🗑️</button></td></tr>`).join('')}</table></div>`}
function modalVei(p=''){const v=S.vei.find(x=>x.placa===p)||{};$('mb').innerHTML=`<h3>Veículo</h3><div class='row'><input id='vp' value='${v.placa||''}' placeholder='Placa' ${p?'disabled':''}><input id='vt' value='${v.tipo||''}' placeholder='Tipo'><input id='vma' value='${v.marca||''}' placeholder='Marca'><input id='vmo' value='${v.modelo||''}' placeholder='Modelo'><input id='vu' value='${v.utilizacao||''}' placeholder='Pool/Convencional'><input id='vh' type='number' value='${v.hodometro||0}' placeholder='Hodômetro'></div><button class='btn p' onclick='saveVei("${p}")'>Salvar</button>`;$('m').classList.remove('hidden')}
function saveVei(old){const placa=$('vp').value.toUpperCase().trim();if(!placa)return;if(!old&&S.vei.some(v=>v.placa===placa))return;const obj={placa,tipo:$('vt').value,marca:$('vma').value,modelo:$('vmo').value,utilizacao:$('vu').value,hodometro:Number($('vh').value)||0}; if(old)S.vei=S.vei.map(v=>v.placa===old?obj:v); else S.vei.push(obj); save();$('m').classList.add('hidden');frota()} function delVei(p){S.vei=S.vei.filter(v=>v.placa!==p);save();frota()}
function cond(){ $('view').innerHTML=`<h2>Condutores</h2><button class='btn p' onclick='modalCon()'>+ Novo</button><div class='wrap'><table><tr><th>Nome</th><th>CNH</th><th>Categoria</th><th>Validade</th><th>Status</th><th>Pontuação</th><th>Ações</th></tr>${S.con.map(c=>`<tr><td>${c.nome}</td><td>${c.cnh||''}</td><td>${c.categoria||''}</td><td>${c.validade||''}</td><td>${c.status||'Ativo'}</td><td>${c.pontos||0}</td><td><button onclick='modalCon("${c.nome}")'>✏️</button><button onclick='delCon("${c.nome}")'>🗑️</button></td></tr>`).join('')}</table></div>`}
function modalCon(n=''){const c=S.con.find(x=>x.nome===n)||{};$('mb').innerHTML=`<h3>Condutor</h3><div class='row'><input id='cn' value='${c.nome||''}' placeholder='Nome'><input id='ccnh' value='${c.cnh||''}' placeholder='CNH'><input id='ccat' value='${c.categoria||''}' placeholder='Categoria'><input id='cval' value='${c.validade||''}' type='date'></div><button class='btn p' onclick='saveCon("${n}")'>Salvar</button>`;$('m').classList.remove('hidden')}
function saveCon(old){const o={nome:$('cn').value,cnh:$('ccnh').value,categoria:$('ccat').value,validade:$('cval').value,status:'Ativo',pontos:0};if(old)S.con=S.con.map(c=>c.nome===old?o:c); else S.con.push(o);save();$('m').classList.add('hidden');cond()} function delCon(n){S.con=S.con.filter(c=>c.nome!==n);save();cond()}
function conf(){ $('view').innerHTML=`<h2>Configurações</h2><div class='row'><button class='btn p' onclick='expJSON()'>Exportar Todos os Dados</button><label class='btn a'>Importar Dados<input id='ij' hidden type='file' accept='.json'></label><button class='btn p' onclick='expCSV()'>Exportar Registros CSV</button><button class='btn' onclick='wipe()'>Limpar Todos os Dados</button></div><div class='wrap'><h3>Gerenciar Tabelas Auxiliares</h3><textarea id='ops' rows='3' style='width:100%'>${S.ope.join(', ')}</textarea><textarea id='vigs' rows='2' style='width:100%;margin-top:6px'>${S.vig.join(', ')}</textarea><button class='btn p' onclick='saveAux()'>Salvar Operações/Vigias</button></div>`;$('ij').onchange=async e=>impJSON(await e.target.files[0].text())}
function saveAux(){S.ope=$('ops').value.split(',').map(x=>x.trim()).filter(Boolean);S.vig=$('vigs').value.split(',').map(x=>x.trim()).filter(Boolean);save();}
function expJSON(){const d={registros:S.reg,veiculos:S.vei,condutores:S.con,rotas:S.rot,vigias:S.vig,operacoes:S.ope};dl('anjo_branco.json',JSON.stringify(d,null,2),'application/json')}
function impJSON(t){const o=JSON.parse(t);S.reg=o.registros||[];S.vei=o.veiculos||[];S.con=o.condutores||[];S.rot=o.rotas||[];S.vig=o.vigias||[];S.ope=o.operacoes||[];save();dash()}
function expCSV(){const h='id;data_saida;data_chegada;placa;operacao;km_saida;km_chegada;km_rodado;rota;transporte;motorista;ajudante;vigia;carrinho;status';const l=S.reg.map(r=>[r.id,r.data_saida||'',r.data_chegada||'',r.placa||'',r.operacao||'',r.km_saida??'',r.km_chegada??'',km(r),r.rota||'',r.transporte||'',r.motorista||'',r.ajudante||'',r.vigia||'',r.carrinho||'',r.status||''].join(';'));dl('registros.csv',[h,...l].join('\n'),'text/csv')}
function dl(n,d,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:t}));a.download=n;a.click()}
function wipe(){if(confirm('Tem certeza?')&&confirm('Isso não pode ser desfeito.')){localStorage.clear();init();auth()}}
$('m').onclick=e=>{if(e.target.id==='m')$('m').classList.add('hidden')}; $('relBtn').onclick=()=>$('relSub').classList.toggle('hidden'); document.querySelectorAll('.item[data-v]').forEach(i=>i.onclick=()=>{document.querySelectorAll('.item').forEach(x=>x.classList.remove('active'));i.classList.add('active');window[i.dataset.v]()});
init();
</script></body></html>
