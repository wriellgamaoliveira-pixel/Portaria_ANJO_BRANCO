<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anjo Branco</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Material+Symbols+Outlined" rel="stylesheet">
<style>body{margin:0;font-family:Inter;background:#0b1220;color:#e2e8f0}.hidden{display:none!important}.app{display:flex;min-height:100vh}.side{width:260px;background:#0f172a;position:fixed;inset:0 auto 0 0;padding:14px;display:flex;flex-direction:column}.main{margin-left:260px;width:calc(100% - 260px);padding:14px}.item{padding:10px;border-radius:8px;cursor:pointer;display:flex;gap:8px}.item:hover,.item.active{background:#1e293b}.card,.panel{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:12px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #233} .badge{padding:2px 8px;border-radius:10px;font-size:12px}.nt{background:#f59e0b33;color:#f59e0b}.fi{background:#22c55e33;color:#22c55e}.ag{background:#b4530933;color:#fb923c}.btn{border:0;border-radius:8px;padding:9px 12px;cursor:pointer}.p{background:#003366;color:#fff}.a{background:#f97316;color:#fff}.input,select,textarea{background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:10px;padding:10px}.row{display:flex;gap:8px;flex-wrap:wrap}.dot{width:10px;height:10px;border-radius:50%;background:#22c55e;display:inline-block;animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.4}}@media(max-width:1024px){.side{width:200px}.main{margin-left:200px;width:calc(100% - 200px)}.btn{padding:12px 14px;font-size:16px}.input,select,textarea{font-size:16px}}.login{min-height:100vh;display:grid;place-items:center}.log{width:min(400px,92vw);background:#111827;border:1px solid #334155;padding:16px;border-radius:12px}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center}.win{background:#0f172a;border:1px solid #334155;border-radius:16px;min-width:320px;max-width:860px;width:94%;position:relative}.head{padding:12px 16px;background:#003366;border-radius:16px 16px 0 0;cursor:move;display:flex;justify-content:space-between}.body{padding:14px;max-height:78vh;overflow:auto}</style></head>
<body>
<div id='login' class='login'><form id='fLogin' class='log'><h2>Anjo Branco</h2><small>100% GitHub Pages (sem Vercel)</small><div class='row'><label><input type='radio' name='modo' value='mestra' checked> Senha Mestra</label><label><input type='radio' name='modo' value='usuario'> Usuário e Senha</label></div><div id='boxUser' class='hidden'><input id='u' class='input' placeholder='Usuário' style='width:100%;margin-top:8px'></div><input id='s' type='password' class='input' placeholder='Senha' style='width:100%;margin-top:8px'><button class='btn p' style='width:100%;margin-top:8px'>Entrar</button><p id='err' style='color:#f87171'></p></form></div>
<div id='app' class='app hidden'><aside class='side'><h2>Transportadora</h2><small>PORTARIA TO OPERATOR</small>
<div id='menu'></div><div style='margin-top:auto'><small><span class='dot'></span> Online no Banco</small><button id='logout' class='btn' style='width:100%;margin-top:8px'>Sair</button></div></aside>
<main class='main'><div class='row' style='justify-content:space-between'><h2>Painel Operacional <span id='unit' class='badge nt'>Unidade TO</span></h2><div id='who'></div></div><div id='view'></div></main></div>
<div id='modal' class='modal hidden'><div id='win' class='win'><div id='whead' class='head'><b id='wt'></b><button class='btn' onclick="hideModal()">✕</button></div><div id='wb' class='body'></div></div></div>
<script>
const K={users:'usuarios',reg:'portaria_registros',vei:'veiculos',con:'condutores',aj:'ajudantes',rot:'rotas',vig:'vigias',ope:'operacoes',cfg:'gh_cfg'};const S={u:null,role:'PORTARIA',data:{}};
const $=id=>document.getElementById(id),b64=t=>btoa(unescape(encodeURIComponent(t))),ub64=t=>decodeURIComponent(escape(atob(t||'')));
const MENU=[['dash','📊 Dashboard',['ADMINISTRADOR','PORTARIA']],['port','🚪 Lançar Portaria',['ADMINISTRADOR','PORTARIA']],['aberto','📋 Viagens em Aberto',['ADMINISTRADOR','PORTARIA']],['enc','📋 Viagens Encerradas',['ADMINISTRADOR']],['cheg','📋 Chegadas da Semana',['ADMINISTRADOR']],['ma','📋 Motorista/Ajudante',['ADMINISTRADOR']],['frota','🚛 Minha Frota',['ADMINISTRADOR']],['cond','👤 Condutores',['ADMINISTRADOR']],['aj','👥 Ajudantes',['ADMINISTRADOR']],['rot','🗺️ Rotas',['ADMINISTRADOR']],['conf','⚙️ Configurações',['ADMINISTRADOR']]];
function init(){if(!localStorage.getItem(K.users))localStorage.setItem(K.users,JSON.stringify([{nome:'Administrador',login:'admin',tipo:'ADMINISTRADOR',status:'Ativo',senha:b64('Anjo@2026')},{nome:'Portaria',login:'portaria',tipo:'PORTARIA',status:'Ativo',senha:b64('portaria123')} ]));try{const uu=JSON.parse(localStorage.getItem(K.users)||'[]');if(!Array.isArray(uu)||!uu.length) throw new Error('x');}catch{localStorage.setItem(K.users,JSON.stringify([{nome:'Administrador',login:'admin',tipo:'ADMINISTRADOR',status:'Ativo',senha:b64('Anjo@2026')},{nome:'Portaria',login:'portaria',tipo:'PORTARIA',status:'Ativo',senha:b64('portaria123')} ]));}
for(const k of [K.reg,K.vei,K.con,K.aj,K.rot,K.vig,K.ope])if(!localStorage.getItem(k))localStorage.setItem(k,'[]');if(!localStorage.getItem(K.vig))localStorage.setItem(K.vig,JSON.stringify([{nome:'Vigia 1'}]));if(!localStorage.getItem(K.ope))localStorage.setItem(K.ope,JSON.stringify([{nome:'BRF'},{nome:'ITALAC'}]));if(!localStorage.getItem(K.cfg))localStorage.setItem(K.cfg,JSON.stringify({owner:'',repo:'',branch:'main',token:'',unidade:'TO'}));
if(sessionStorage.getItem('user')){S.u=JSON.parse(sessionStorage.getItem('user'));S.role=S.u.tipo;showApp();}}
function showApp(){ $('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=`${S.u.nome} (${S.u.tipo})`;$('unit').textContent='Unidade '+(JSON.parse(localStorage.getItem(K.cfg)).unidade||'TO');renderMenu();render('dash'); }
document.querySelectorAll('input[name=modo]').forEach(r=>r.onchange=()=>$('boxUser').classList.toggle('hidden',document.querySelector('input[name=modo]:checked').value!=='usuario'));$('fLogin').onsubmit=e=>{e.preventDefault();const modo=document.querySelector('input[name=modo]:checked').value;const senha=$('s').value;if(modo==='mestra'){if(senha!=='Anjo@2026'){$('err').textContent='Senha mestra incorreta';return}const master={nome:'Mestre',login:'',tipo:'ADMINISTRADOR',status:'Ativo'};sessionStorage.setItem('user',JSON.stringify(master));S.u=master;S.role='ADMINISTRADOR';showApp();return;}const us=JSON.parse(localStorage.getItem(K.users));const login=($('u').value||'').trim().toLowerCase();const pass=b64(senha);const u=us.find(x=>(x.login||'').toLowerCase()===login&&x.senha===pass);if(!u){$('err').textContent='Usuário ou senha incorretos';return}sessionStorage.setItem('user',JSON.stringify(u));S.u=u;S.role=u.tipo;showApp()};$('logout').onclick=()=>{sessionStorage.clear();location.reload()};
function renderMenu(){const m=$('menu');m.innerHTML='';MENU.filter(x=>x[2].includes(S.role)).forEach((x,i)=>{const d=document.createElement('div');d.className='item'+(i===0?' active':'');d.textContent=x[1];d.onclick=()=>{document.querySelectorAll('.item').forEach(i=>i.classList.remove('active'));d.classList.add('active');render(x[0])};m.appendChild(d)});}
function get(k){try{const v=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(v)||typeof v==='object'?v:[];}catch{return []}} function set(k,v){localStorage.setItem(k,JSON.stringify(v))}
function recOpen(){return get(K.reg).filter(r=>!r.data_chegada)}
function render(v){if(v==='dash')return dash();if(v==='port')return port();if(v==='aberto')return tabela('Viagens em Aberto',x=>!x.data_chegada);if(v==='enc')return tabela('Viagens Encerradas',x=>x.data_chegada);if(v==='cheg')return tabela('Chegadas da Semana',x=>x.data_chegada);if(v==='ma')return motAju();if(v==='frota')return crud(K.vei,'Minha Frota',['placa','tipo','marca','modelo','utilizacao','hodometro','status']);if(v==='cond')return crud(K.con,'Condutores',['nome','cnh','categoria','validade_cnh','status','pontuacao']);if(v==='aj')return crud(K.aj,'Ajudantes',['nome','telefone','status']);if(v==='rot')return crud(K.rot,'Rotas',['nome','origem','destino','km_estimado','tempo_estimado']);if(v==='conf')return conf();}
function dash(){const r=get(K.reg),hoje=new Date().toISOString().slice(0,10),mes=hoje.slice(0,7);const cards=[r.filter(x=>(x.data_saida||'').startsWith(hoje)).length,r.filter(x=>(x.data_saida||'').startsWith(mes)).reduce((a,b)=>a+((+b.km_chegada||0)-(+b.km_saida||0)),0),r.filter(x=>(x.data_saida||'').startsWith(mes)&&x.status==='Finalizada').length,r.filter(x=>!x.data_chegada).length];
$('view').innerHTML=`<div class='cards'><div class='card'>Registros Hoje<br><b>${cards[0]}</b></div><div class='card'>Km Mês<br><b>${cards[1]}</b></div><div class='card'>Finalizadas<br><b>${cards[2]}</b></div><div class='card'>No Pátio<br><b>${cards[3]}</b></div></div><div class='panel' style='margin-top:10px'><h3>Fluxo Recente</h3><table><tr><th>Horário</th><th>Placa</th><th>Motorista</th><th>Destino</th><th>Nº</th><th>KM</th><th>Status</th></tr>${r.filter(x=>!x.data_chegada).map(x=>`<tr><td>${new Date(x.data_saida).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</td><td>${x.placa}</td><td>${x.motorista||'-'}</td><td>${x.rota||'-'}</td><td>${x.transporte||'-'}</td><td>${x.km_saida||'-'}</td><td><span class='badge nt'>No Trecho</span></td></tr>`).join('')}</table></div>`}
function port(){const vei=get(K.vei),con=get(K.con),aj=get(K.aj),rot=get(K.rot),vig=get(K.vig),ops=get(K.ope);$('view').innerHTML=`<div class='row'><button class='btn p' onclick='openPort("saida")'>Registrar Saída</button><button class='btn a' onclick='openPort("chegada")'>Registrar Chegada</button></div><small>Porteiro cria lançamentos. Registros não são editáveis depois.</small>`;window.openPort=(tipo)=>{showModal(tipo==='saida'?'Lançar Saída':'Lançar Chegada',`<div class='row'><input id='placa' list='lv' class='input' placeholder='Placa'><datalist id='lv'>${vei.map(v=>`<option>${v.placa||''}</option>`)}</datalist><select id='oper'>${ops.map(o=>`<option>${o.nome||o}</option>`)}</select><input id='kms' type='number' class='input' placeholder='KM Saída'><input id='kme' type='number' class='input' placeholder='KM Chegada'></div><div class='row'><input id='rota' list='lr' class='input' placeholder='Rota'><datalist id='lr'>${rot.map(r=>`<option>${r.nome||''}</option>`)}</datalist><input id='trans' class='input' placeholder='Nº Transporte'><input id='mot' list='lc' class='input' placeholder='Motorista'><datalist id='lc'>${con.map(c=>`<option>${c.nome||''}</option>`)}</datalist><input id='ajd' list='la' class='input' placeholder='Ajudante'><datalist id='la'>${aj.map(a=>`<option>${a.nome||''}</option>`)}</datalist></div><div class='row'><select id='vig'>${vig.map(v=>`<option>${v.nome||v}</option>`)}</select><select id='car'><option>Com Carrinho</option><option>Sem Carrinho</option></select><input id='foto' type='file' accept='image/*' capture='environment'></div><button class='btn p' onclick='savePort("${tipo}")'>Salvar</button>`)}}
window.savePort=async(tipo)=>{const placa=$('placa').value.trim().toUpperCase();if(!placa)return;const foto=await img64($('foto').files[0]);let r=get(K.reg);if(tipo==='saida'){r.push({id:crypto.randomUUID(),tipo_operacao:'Viagem',placa,operacao:$('oper').value,km_saida:+$('kms').value||null,km_chegada:null,rota:$('rota').value,transporte:$('trans').value,motorista:$('mot').value,ajudante:$('ajd').value,vigia:$('vig').value,carrinho_saida:$('car').value,carrinho_entrada:'',foto_saida:foto,foto_chegada:'',data_saida:new Date().toISOString(),data_chegada:'',status:'Em Aberto',unidade:JSON.parse(localStorage.getItem(K.cfg)).unidade||'TO',observacao:''});}
else{const o=[...r].reverse().find(x=>x.placa===placa&&!x.data_chegada);if(o){o.km_chegada=+$('kme').value||null;o.data_chegada=new Date().toISOString();o.foto_chegada=foto;o.status='Finalizada';o.carrinho_entrada=$('car').value;}}
set(K.reg,r);hideModal();dash()}
}
function tabela(t,fn){const r=get(K.reg).filter(fn);$('view').innerHTML=`<div class='panel'><h3>${t}</h3><table><tr><th>S:</th><th>E:</th><th>Placa</th><th>Motorista</th><th>KM</th><th>Carrinho</th><th>Rota</th><th>Transporte</th></tr>${r.map(x=>`<tr><td>${new Date(x.data_saida).toLocaleString('pt-BR')}</td><td>${x.data_chegada?new Date(x.data_chegada).toLocaleString('pt-BR'):'<span class="badge ag">AG. CHEG.</span>'}</td><td>${x.placa}</td><td>${x.motorista||'-'}</td><td>${x.data_chegada?((+x.km_chegada||0)-(+x.km_saida||0)):'-'}</td><td>${x.carrinho_saida||'-'}</td><td>${x.rota||'-'}</td><td>${x.transporte||'-'}</td></tr>`).join('')}</table><button class='btn p' onclick='expCSV()'>📥 Apenas Excel</button></div>`}
function motAju(){const r=get(K.reg);$('view').innerHTML=`<div class='cards'><div class='card'>Total Viagens<br><b>${r.length}</b></div><div class='card'>Motoristas Únicos<br><b>${new Set(r.map(x=>x.motorista)).size}</b></div></div><div class='panel'><table><tr><th>Motorista</th><th>Ajudante</th><th>Placa</th><th>Data</th><th>Rota</th><th>Qtd</th></tr>${r.map(x=>`<tr><td>${x.motorista||'-'}</td><td>${x.ajudante||'-'}</td><td>${x.placa}</td><td>${new Date(x.data_saida).toLocaleDateString('pt-BR')}</td><td>${x.rota||'-'}</td><td>1</td></tr>`).join('')}</table></div>`}
function crud(key,title,cols){const d=get(key);$('view').innerHTML=`<div class='panel'><h3>${title}</h3><button class='btn p' onclick='openCrud("${key}",${JSON.stringify(cols).replace(/"/g,'&quot;')})'>+ Novo</button><table><tr>${cols.map(c=>`<th>${c}</th>`).join('')}<th>Ações</th></tr>${d.map((x,i)=>`<tr>${cols.map(c=>`<td>${x[c]??''}</td>`).join('')}<td><button onclick='openCrudEdit("${key}",${i},${JSON.stringify(cols).replace(/"/g,'&quot;')})'>✏️</button><button onclick='delCrud("${key}",${i})'>🗑️</button></td></tr>`).join('')}</table></div>`}
window.delCrud=(k,i)=>{const d=get(k);d.splice(i,1);set(k,d);crud(k,k,Object.keys(d[0]||{}))}
window.openCrud=(k,cols)=>{showModal('Novo cadastro',cols.map(c=>`<input id='f_${c}' class='input' placeholder='${c}'>`).join('')+`<button class='btn p' onclick='saveCrud("${k}",${JSON.stringify(cols).replace(/"/g,'&quot;')})'>Salvar</button>`)}
window.openCrudEdit=(k,i,cols)=>{const d=get(k)[i];showModal('Editar',cols.map(c=>`<input id='f_${c}' class='input' value='${d[c]??''}' placeholder='${c}'>`).join('')+`<button class='btn p' onclick='saveCrud("${k}",${JSON.stringify(cols).replace(/"/g,'&quot;')},${i})'>Salvar</button>`)}
window.saveCrud=(k,cols,i=null)=>{const d=get(k),o={};cols.forEach(c=>o[c]=$("f_"+c).value);if(i==null)d.push(o);else d[i]=o;set(k,d);hideModal();crud(k,k,cols)}
function conf(){const c=JSON.parse(localStorage.getItem(K.cfg));const users=JSON.parse(localStorage.getItem(K.users));$('view').innerHTML=`<div class='panel'><h3>GitHub</h3><div class='row'><input id='tk' class='input' placeholder='token' value='${c.token||''}'><input id='ow' class='input' placeholder='owner' value='${c.owner||''}'><input id='rp' class='input' placeholder='repo' value='${c.repo||''}'><input id='br' class='input' placeholder='branch' value='${c.branch||'main'}'><button class='btn p' onclick='testGH()'>Testar Conexão (Opcional)</button></div><div class='row'><select id='un'><option ${c.unidade==='TO'?'selected':''}>TO</option><option ${c.unidade==='BA'?'selected':''}>BA</option></select><button class='btn p' onclick='saveCfg()'>Salvar Config</button></div></div><div class='panel'><h3>Usuários</h3><button class='btn p' onclick='newUser()'>+ Novo Usuário</button><table><tr><th>Nome</th><th>Login</th><th>Tipo</th><th>Status</th></tr>${users.map(u=>`<tr><td>${u.nome}</td><td>${u.login}</td><td>${u.tipo}</td><td>${u.status}</td></tr>`).join('')}</table></div><div class='row'><button class='btn p' onclick='expJSON()'>Exportar Tudo</button><label class='btn a'>Importar Tudo<input id='ij' hidden type='file' accept='.json'></label><button class='btn' onclick='wipe()'>Limpar dados</button></div>`;$('ij').onchange=async e=>impJSON(await e.target.files[0].text())}
window.saveCfg=()=>{localStorage.setItem(K.cfg,JSON.stringify({token:$('tk').value,owner:$('ow').value,repo:$('rp').value,branch:$('br').value,unidade:$('un').value}));}
window.newUser=()=>showModal('Novo Usuário',`<input id='n' class='input' placeholder='Nome'><input id='l' class='input' placeholder='Login'><input id='pw' class='input' placeholder='Senha'><select id='tp'><option>PORTARIA</option><option>ADMINISTRADOR</option></select><button class='btn p' onclick='saveUser()'>Salvar</button>`)
window.saveUser=()=>{const us=JSON.parse(localStorage.getItem(K.users));us.push({nome:$('n').value,login:$('l').value,tipo:$('tp').value,status:'Ativo',senha:b64($('pw').value)});localStorage.setItem(K.users,JSON.stringify(us));hideModal();conf()}
window.testGH=async()=>{try{const c=JSON.parse(localStorage.getItem(K.cfg));const r=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}`,{headers:{Authorization:`Bearer ${c.token}`}});alert(r.ok?'Conexão OK':'Falha na conexão')}catch{alert('Erro')}}
function csvRows(arr,cols){return [cols.join(';'),...arr.map(x=>cols.map(c=>String(x[c]??'')).join(';'))].join('\n')}
async function syncAll(){const c=JSON.parse(localStorage.getItem(K.cfg));if(!c.token||!c.owner||!c.repo)return;const files={
'registros.csv':csvRows(get(K.reg),['id','tipo_operacao','placa','operacao','km_saida','km_chegada','rota','transporte','motorista','ajudante','vigia','carrinho_saida','carrinho_entrada','foto_saida','foto_chegada','data_saida','data_chegada','status','unidade','observacao']),
'veiculos.csv':csvRows(get(K.vei),['placa','tipo','marca','modelo','utilizacao','hodometro','status']),
'condutores.csv':csvRows(get(K.con),['nome','cnh','categoria','validade_cnh','status','pontuacao']),
'ajudantes.csv':csvRows(get(K.aj),['nome','telefone','status']),'rotas.csv':csvRows(get(K.rot),['nome','origem','destino','km_estimado','tempo_estimado']),'vigias.csv':csvRows(get(K.vig),['nome']),'operacoes.csv':csvRows(get(K.ope),['nome'])};
for(const [name,content] of Object.entries(files)){await upFile(c,name,content).catch(()=>{})}}
async function upFile(c,name,text){const path='dados/'+name;let sha='';const g=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${path}?ref=${c.branch||'main'}`,{headers:{Authorization:`Bearer ${c.token}`}});if(g.ok)sha=(await g.json()).sha;await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${path}`,{method:'PUT',headers:{Authorization:`Bearer ${c.token}`,'Content-Type':'application/json'},body:JSON.stringify({message:`update ${name}`,content:btoa(unescape(encodeURIComponent(text))),sha,branch:c.branch||'main'})})}
async function img64(f){if(!f)return'';const d=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});return await resize(d,800)}
function resize(src,maxW){return new Promise(res=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');const s=Math.min(1,maxW/i.width);c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.8))};i.src=src})}
function showModal(t,h){$('wt').textContent=t;$('wb').innerHTML=h;$('modal').classList.remove('hidden')} function hideModal(){$('modal').classList.add('hidden')}
let dx=0,dy=0,drag=false;$('whead').onmousedown=e=>{drag=true;dx=e.clientX-$('win').offsetLeft;dy=e.clientY-$('win').offsetTop};window.onmouseup=()=>drag=false;window.onmousemove=e=>{if(!drag)return;$('win').style.margin='0';$('win').style.position='fixed';$('win').style.left=(e.clientX-dx)+'px';$('win').style.top=(e.clientY-dy)+'px'}
function expJSON(){const all={registros:get(K.reg),veiculos:get(K.vei),condutores:get(K.con),ajudantes:get(K.aj),rotas:get(K.rot),vigias:get(K.vig),operacoes:get(K.ope),usuarios:JSON.parse(localStorage.getItem(K.users))};dl('anjo_branco_backup.json',JSON.stringify(all,null,2),'application/json')}
function impJSON(t){const o=JSON.parse(t);set(K.reg,o.registros||[]);set(K.vei,o.veiculos||[]);set(K.con,o.condutores||[]);set(K.aj,o.ajudantes||[]);set(K.rot,o.rotas||[]);set(K.vig,o.vigias||[]);set(K.ope,o.operacoes||[]);if(o.usuarios)localStorage.setItem(K.users,JSON.stringify(o.usuarios));}
function expCSV(){dl('registros.csv',csvRows(get(K.reg),['id','tipo_operacao','placa','operacao','km_saida','km_chegada','rota','transporte','motorista','ajudante','vigia','carrinho_saida','carrinho_entrada','foto_saida','foto_chegada','data_saida','data_chegada','status','unidade','observacao']),'text/csv')}
