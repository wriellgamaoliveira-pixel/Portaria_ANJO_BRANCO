<!doctype html><html lang='pt-BR'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Anjo Branco</title><link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Material+Symbols+Outlined' rel='stylesheet'>
<style>body{margin:0;font-family:Inter;background:#0b1220;color:#e2e8f0}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center}.box{background:#111827;border:1px solid #334155;border-radius:14px;padding:18px;width:min(460px,94vw)}.input{width:100%;padding:12px;background:#0f172a;color:#fff;border:1px solid #334155;border-radius:10px}.btn{width:100%;padding:11px;border:0;border-radius:10px;background:#003366;color:#fff;cursor:pointer}.app{display:flex;min-height:100vh}.side{width:240px;background:#0f172a;padding:12px;position:fixed;inset:0 auto 0 0}.main{margin-left:240px;padding:12px;width:calc(100% - 240px)}.item{padding:10px;border-radius:8px;cursor:pointer}.item:hover,.item.active{background:#1e293b}.card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:12px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.dot{width:10px;height:10px;border-radius:50%;background:#22c55e;display:inline-block;animation:p 1s infinite}@keyframes p{50%{opacity:.4}}</style></head>
<body>
<div id='login' class='login'><form id='f' class='box'><h1>Anjo Branco</h1><p>100% GitHub Pages</p><label><input type='radio' name='m' value='mestra' checked> Senha Mestra</label> <label><input type='radio' name='m' value='usuario'> Usuário e Senha</label><div id='userWrap' class='hidden' style='margin-top:8px'><input id='u' class='input' placeholder='Usuário'></div><input id='s' class='input' type='password' placeholder='Senha' style='margin-top:8px'><button class='btn' type='submit' style='margin-top:8px'>Entrar</button><p id='e' style='color:#f87171'></p></form></div>
<div id='app' class='app hidden'><aside class='side'><h2>Transportadora</h2><div id='menu'></div><div style='position:absolute;bottom:14px'><small><span class='dot'></span> Online no Banco</small><br><button id='out'>Sair</button></div></aside><main class='main'><h2 id='title'></h2><div id='view'></div></main></div>
<script>
const K={users:'usuarios',log:'logado'};const MENU={ADMINISTRADOR:['Dashboard','Lançar Portaria','Viagens em Aberto','Viagens Encerradas','Chegadas da Semana','Motorista/Ajudante','Minha Frota','Condutores','Ajudantes','Rotas','Configurações'],PORTARIA:['Dashboard','Lançar Portaria','Viagens em Aberto']};
function init(){if(!localStorage.getItem(K.users)){localStorage.setItem(K.users,JSON.stringify([{nome:'Administrador',login:'admin',tipo:'ADMINISTRADOR',senha:btoa('Anjo@2026')},{nome:'Portaria',login:'portaria',tipo:'PORTARIA',senha:btoa('portaria123')}]));}if(sessionStorage.getItem(K.log)==='true'&&sessionStorage.getItem('user'))showApp(JSON.parse(sessionStorage.getItem('user')));}
const userWrap=document.getElementById('userWrap');document.querySelectorAll('input[name=m]').forEach(r=>r.addEventListener('change',()=>userWrap.classList.toggle('hidden',document.querySelector('input[name=m]:checked').value!=='usuario')));
document.getElementById('f').addEventListener('submit',(ev)=>{ev.preventDefault();const modo=document.querySelector('input[name=m]:checked').value;const senha=document.getElementById('s').value;const err=document.getElementById('e');if(modo==='mestra'){if(senha!=='Anjo@2026'){err.textContent='Senha mestra incorreta';return;}const u={nome:'Mestre',login:'',tipo:'ADMINISTRADOR'};sessionStorage.setItem(K.log,'true');sessionStorage.setItem('user',JSON.stringify(u));showApp(u);return;}const login=(document.getElementById('u').value||'').trim().toLowerCase();const users=JSON.parse(localStorage.getItem(K.users)||'[]');const u=users.find(x=>(x.login||'').toLowerCase()===login&&x.senha===btoa(senha));if(!u){err.textContent='Usuário ou senha incorretos';return;}sessionStorage.setItem(K.log,'true');sessionStorage.setItem('user',JSON.stringify(u));showApp(u);});
function showApp(user){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');const menu=document.getElementById('menu');menu.innerHTML='';MENU[user.tipo].forEach((name,i)=>{const d=document.createElement('div');d.className='item'+(i===0?' active':'');d.textContent=name;d.onclick=()=>{document.querySelectorAll('.item').forEach(x=>x.classList.remove('active'));d.classList.add('active');openView(name);};menu.appendChild(d);});openView('Dashboard');document.getElementById('out').onclick=()=>{sessionStorage.clear();location.reload();};}
function openView(name){document.getElementById('title').textContent=name;const v=document.getElementById('view');if(name==='Dashboard'){v.innerHTML="<div class='cards'><div class='card'>Registros Hoje: 0</div><div class='card'>Km Mês: 0</div><div class='card'>Finalizadas: 0</div><div class='card'>No Pátio: 0</div></div>";return;}v.innerHTML="<div class='card'>Tela em construção funcional. Login corrigido e estável.</div>";}
init();
</script></body></html>
