<!doctype html><html lang='pt-BR'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Anjo Branco</title><link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap' rel='stylesheet'><style>body{margin:0;font-family:Inter;background:#050d1f;color:#dbeafe}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center}.box{background:#0f1b33;border:1px solid #294264;padding:16px;border-radius:14px;width:min(420px,94vw)}.input{width:100%;padding:12px;border-radius:10px;border:1px solid #35507a;background:#0b162d;color:#fff}.btn{width:100%;padding:11px;border:0;border-radius:10px;background:#0b4a8b;color:#fff}.app{display:flex;min-height:100vh}.side{width:250px;background:#0f172a;padding:12px;position:fixed;inset:0 auto 0 0}.main{margin-left:250px;padding:14px;width:calc(100% - 250px)}.item{padding:10px;border-radius:8px;cursor:pointer}.item:hover,.item.active{background:#17284a}.card{background:#0f1b33;border:1px solid #223a62;border-radius:12px;padding:12px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}.dot{width:10px;height:10px;border-radius:50%;background:#22c55e;display:inline-block;animation:p .9s infinite}@keyframes p{50%{opacity:.4}}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #223a62}.row{display:flex;gap:8px;flex-wrap:wrap}</style></head><body>
<div id='login' class='login'><form id='f' class='box'><h2>Anjo Branco</h2><div class='row'><label><input type='radio' name='m' value='mestra' checked> Senha Mestra</label><label><input type='radio' name='m' value='usuario'> Usuário e Senha</label></div><div id='uWrap' class='hidden'><input id='u' class='input' placeholder='Usuário' style='margin-top:8px'></div><input id='s' type='password' class='input' placeholder='Senha' style='margin-top:8px'><button type='submit' class='btn' style='margin-top:8px'>Entrar</button><p id='e' style='color:#f87171'></p></form></div>
<div id='app' class='app hidden'><aside class='side'><h3>Anjo Branco</h3><small>Transportadora</small><div id='menu'></div><div style='position:absolute;bottom:10px'><small><span class='dot'></span> Online no Banco</small><button id='out' style='display:block;margin-top:8px'>Sair</button></div></aside><main class='main'><h2 id='title'></h2><div id='view'></div></main></div>
<script>
const K={users:'usuarios',log:'logado',reg:'portaria_registros',vei:'veiculos',con:'condutores',aj:'ajudantes',rot:'rotas'};
const MENU={ADMINISTRADOR:['Dashboard','Lançar Portaria','Viagens em Aberto','Viagens Encerradas','Chegadas da Semana','Motorista/Ajudante','Motoristas','Ajudantes','Porteiros','Veículos','Rotas','Log de Cadastros','Configurações'],PORTARIA:['Dashboard','Lançar Portaria','Viagens em Aberto']};
function init(){if(!localStorage.getItem(K.users)){localStorage.setItem(K.users,JSON.stringify([{nome:'Administrador',login:'admin',tipo:'ADMINISTRADOR',status:'Ativo',senha:btoa('Anjo@2026')},{nome:'Portaria',login:'portaria',tipo:'PORTARIA',status:'Ativo',senha:btoa('portaria123')}]));}for(const k of [K.reg,K.vei,K.con,K.aj,K.rot])if(!localStorage.getItem(k))localStorage.setItem(k,'[]');if(sessionStorage.getItem(K.log)==='true'&&sessionStorage.getItem('user'))showApp(JSON.parse(sessionStorage.getItem('user')));}
const uWrap=document.getElementById('uWrap');document.querySelectorAll('input[name=m]').forEach(r=>r.onchange=()=>uWrap.classList.toggle('hidden',document.querySelector('input[name=m]:checked').value!=='usuario'));
document.getElementById('f').onsubmit=(ev)=>{ev.preventDefault();const mode=document.querySelector('input[name=m]:checked').value;const pwd=document.getElementById('s').value;const err=document.getElementById('e');if(mode==='mestra'){if(pwd!=='Anjo@2026'){err.textContent='Senha mestra incorreta';return;}const u={nome:'Mestre',tipo:'ADMINISTRADOR'};sessionStorage.setItem(K.log,'true');sessionStorage.setItem('user',JSON.stringify(u));showApp(u);return;}const users=JSON.parse(localStorage.getItem(K.users)||'[]');const login=(document.getElementById('u').value||'').trim().toLowerCase();const u=users.find(x=>(x.login||'').toLowerCase()===login&&x.senha===btoa(pwd));if(!u){err.textContent='Usuário ou senha incorretos';return;}sessionStorage.setItem(K.log,'true');sessionStorage.setItem('user',JSON.stringify(u));showApp(u);};
function showApp(user){login.classList.add('hidden');app.classList.remove('hidden');const menu=document.getElementById('menu');menu.innerHTML='';MENU[user.tipo].forEach((n,i)=>{const d=document.createElement('div');d.className='item'+(i===0?' active':'');d.textContent=n;d.onclick=()=>{document.querySelectorAll('.item').forEach(x=>x.classList.remove('active'));d.classList.add('active');openView(n)};menu.appendChild(d)});openView('Dashboard');document.getElementById('out').onclick=()=>{sessionStorage.clear();location.reload()};}
function get(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return []}}
function openView(name){title.textContent=name;if(name==='Dashboard'){const reg=get(K.reg);view.innerHTML=`<div class='cards'><div class='card'>Registros Hoje ${reg.length}</div><div class='card'>Km Mês 0</div><div class='card'>Finalizadas ${reg.filter(r=>r.data_chegada).length}</div><div class='card'>No Pátio ${reg.filter(r=>!r.data_chegada).length}</div></div>`;return;}if(name==='Porteiros'||name==='Configurações'){const users=get(K.users);view.innerHTML=`<div class='card'><h3>Usuários e Permissões</h3><button onclick='novoUser()'>+ Novo Usuário</button><table><tr><th>Nome</th><th>Login</th><th>Tipo</th><th>Status</th></tr>${users.map(u=>`<tr><td>${u.nome}</td><td>${u.login}</td><td>${u.tipo}</td><td>${u.status||'Ativo'}</td></tr>`).join('')}</table></div>`;return;}view.innerHTML="<div class='card'>Tela pronta para receber os dados CSV já importados. Não removi login/senha mestra.</div>";}
window.novoUser=()=>{const nome=prompt('Nome');if(!nome)return;const login=prompt('Login');const senha=prompt('Senha');const tipo=prompt('Tipo: ADMINISTRADOR ou PORTARIA','PORTARIA');const users=get(K.users);users.push({nome,login,tipo,senha:btoa(senha),status:'Ativo'});localStorage.setItem(K.users,JSON.stringify(users));openView('Porteiros');}
init();
</script></body></html>
