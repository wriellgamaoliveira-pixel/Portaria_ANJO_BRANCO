<!doctype html><html lang='pt-BR'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Portaria SPA</title><script src='https://cdn.jsdelivr.net/npm/chart.js'></script>
<style>
:root{--az:#1a237e;--ac:#ff6f00;--bg:#f0f2f5}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg)}.hidden{display:none!important}
.app{display:flex;min-height:100vh}.side{width:240px;background:var(--az);color:#fff;position:fixed;inset:0 auto 0 0;padding:14px;display:flex;flex-direction:column}.nav{display:block;width:100%;padding:10px;border:0;background:transparent;color:#fff;text-align:left;border-radius:8px;margin:4px 0;cursor:pointer}.nav.active,.nav:hover{background:#ffffff22}.main{margin-left:240px;padding:16px;width:calc(100% - 240px)}.hamb{display:none}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px #0001}.wrap{background:#fff;border-radius:12px;padding:12px;margin-top:12px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #eee}tbody tr:nth-child(even){background:#fafafa}tbody tr:hover{background:#f5f5f5}
.btn{border:0;border-radius:8px;padding:10px 12px;cursor:pointer}.p{background:var(--az);color:#fff}.a{background:var(--ac);color:#fff}.d{background:#c62828;color:#fff}.s{background:#2e7d32;color:#fff}
.bad{padding:3px 8px;border-radius:12px;font-size:12px}.entrada{background:#e3f2fd;color:#1565c0}.saida{background:#e8f5e9;color:#2e7d32}.man{background:#fff3e0;color:#ef6c00}.cli{background:#f3e5f5;color:#7b1fa2}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:10px}.box{background:#fff;border-radius:12px;padding:14px;max-width:620px;width:100%;max-height:92vh;overflow:auto}.grid{display:grid;gap:8px}.row{display:flex;gap:8px;flex-wrap:wrap}.toast{position:fixed;right:12px;top:12px;padding:10px 12px;border-radius:8px;color:#fff;opacity:0;transition:.2s}.toast.show{opacity:1}.ok{background:#2e7d32}.err{background:#c62828}
input,select,textarea{padding:10px;border:1px solid #ccc;border-radius:8px;width:100%} .inv{border-color:#c62828}.login{min-height:100vh;display:grid;place-items:center}.logbox{background:#fff;padding:22px;border-radius:12px;width:min(360px,92vw)}
@media(max-width:767px){.side{transform:translateX(-100%);transition:.2s}.side.open{transform:translateX(0)}.main{margin-left:0;width:100%}.hamb{display:inline-block;background:var(--az);color:#fff;border:0;border-radius:8px;padding:8px 10px}}
</style></head><body>
<div id='login' class='login'><form id='fLogin' class='logbox'><h2>🚛 Portaria</h2><label><input type='radio' name='modo' value='master' checked> Senha Mestra</label> <label><input type='radio' name='modo' value='porteiro'> Usuário Porteiro</label> <label><input type='radio' name='modo' value='admin'> Usuário Administrativo</label><div id='masterBox'><input id='senha' type='password' placeholder='Senha mestra'></div><div id='porteiroBox' class='hidden'><input id='usuario' placeholder='Usuário porteiro'><input id='senhaP' type='password' placeholder='Senha porteiro'></div><div id='adminBox' class='hidden'><input id='usuarioA' placeholder='Usuário administrativo'><input id='senhaA' type='password' placeholder='Senha administrativo'></div><button class='btn p' style='width:100%;margin-top:8px'>Entrar</button><p id='lerr' style='color:#c62828'></p></form></div>
<div id='app' class='app hidden'><aside id='side' class='side'><h2>🚛 Transportadora</h2>
<button class='nav active' data-v='dash'>📊 Dashboard</button><button class='nav' data-v='port'>🚪 Portaria</button><button class='nav' data-v='hist'>📋 Histórico</button><button class='nav' data-v='frota'>🚛 Frota</button><button class='nav' data-v='cond'>👤 Condutores</button><button class='nav' data-v='rotas'>🗺️ Rotas</button><button class='nav' data-v='users'>🛂 Porteiros</button><button class='nav' data-v='conf'>⚙️ Configurações</button>
<div style='margin-top:auto'><button id='sair' class='btn d' style='width:100%'>Sair</button></div></aside><main class='main'><button id='hamb' class='hamb'>☰</button><div id='view'></div></main></div>
<div id='m' class='modal hidden'><div id='mb' class='box'></div></div><div id='fotoM' class='modal hidden'><img id='fotoBig' style='max-width:90%;max-height:80vh'><button id='fx' class='btn' style='position:absolute;top:15px;right:15px'>✖</button></div><div id='t' class='toast'></div>
<script>
const SENHA='Anjo@2026',K={reg:'portaria_registros',vei:'portaria_veiculos',mot:'portaria_motoristas',rot:'portaria_rotas',usr:'portaria_usuarios',log:'portaria_logado',usrAt:'portaria_usuario_atual',role:'portaria_role'};
const S={reg:[],vei:[],mot:[],rot:[],usr:[],f:'todos',q:''}; let chartBar,chartPie;
const $=i=>document.getElementById(i), id=()=>Date.now()+'_'+Math.random().toString(36).slice(2,7); const show=(m,e=false)=>{const t=$('t');t.textContent=m;t.className='toast show '+(e?'err':'ok');setTimeout(()=>t.className='toast',3000)};
function init(){for(const k of [K.reg,K.vei,K.mot,K.rot,K.usr]) if(!localStorage.getItem(k)) localStorage.setItem(k,'[]'); load(); auth();}
function load(){try{S.reg=JSON.parse(localStorage.getItem(K.reg)||'[]');S.vei=JSON.parse(localStorage.getItem(K.vei)||'[]');S.mot=JSON.parse(localStorage.getItem(K.mot)||'[]');S.rot=JSON.parse(localStorage.getItem(K.rot)||'[]');S.usr=JSON.parse(localStorage.getItem(K.usr)||'[]')}catch{S.reg=[];S.vei=[];S.mot=[];S.rot=[]}}
function save(){localStorage.setItem(K.reg,JSON.stringify(S.reg));localStorage.setItem(K.vei,JSON.stringify(S.vei));localStorage.setItem(K.mot,JSON.stringify(S.mot));localStorage.setItem(K.rot,JSON.stringify(S.rot));localStorage.setItem(K.usr,JSON.stringify(S.usr))}
function auth(){const ok=localStorage.getItem(K.log)==='true';$('login').classList.toggle('hidden',ok);$('app').classList.toggle('hidden',!ok); if(ok){const role=localStorage.getItem(K.role)||'master';aplicaPermissao(role);render(role==='porteiro'?'port':'dash')}}
document.querySelectorAll('input[name=modo]').forEach(r=>r.onchange=()=>{const m=document.querySelector('input[name=modo]:checked').value;$('porteiroBox').classList.toggle('hidden',m!=='porteiro');$('adminBox').classList.toggle('hidden',m!=='admin');$('masterBox').classList.toggle('hidden',m!=='master');});$('fLogin').onsubmit=e=>{e.preventDefault();const modo=document.querySelector('input[name=modo]:checked').value;if(modo==='master'){if($('senha').value===SENHA){localStorage.setItem(K.log,'true');localStorage.setItem(K.role,'master');$('lerr').textContent='';auth();}else $('lerr').textContent='Senha incorreta';return;}if(modo==='porteiro'){const u=S.usr.find(x=>x.nome===$('usuario').value.trim()&&x.senha===$('senhaP').value&&(x.perfil||'porteiro')==='porteiro');if(u){localStorage.setItem(K.log,'true');localStorage.setItem(K.role,'porteiro');localStorage.setItem(K.usrAt,u.nome);$('lerr').textContent='';auth();}else $('lerr').textContent='Usuário/Senha inválidos';return;}const a=S.usr.find(x=>x.nome===$('usuarioA').value.trim()&&x.senha===$('senhaA').value&&x.perfil==='admin');if(a){localStorage.setItem(K.log,'true');localStorage.setItem(K.role,'admin');localStorage.setItem(K.usrAt,a.nome);$('lerr').textContent='';auth();}else $('lerr').textContent='Usuário/Senha inválidos'}; $('sair').onclick=()=>{localStorage.removeItem(K.log);localStorage.removeItem(K.role);auth()};

function km(r){return (r.km_entrada!=null&&r.km_saida!=null)?Number(r.km_saida)-Number(r.km_entrada):0} function patio(){return S.reg.filter(r=>r.tipo==='entrada'&&r.km_saida==null)}
function aplicaPermissao(role){document.querySelectorAll('.nav').forEach(b=>{if(role==='porteiro'&&b.dataset.v!=='port')b.classList.add('hidden'); else if(role==='admin'&&b.dataset.v==='users')b.classList.add('hidden'); else b.classList.remove('hidden');});}
function aplicarSomenteVisualizacao(){const role=localStorage.getItem(K.role)||'master';if(role!=='admin')return;const v=document.querySelector('.nav.active')?.dataset.v;if(v==='port')return;document.querySelectorAll('#view button,#view input,#view select,#view textarea').forEach(el=>{if(el.closest('canvas'))return; if(el.tagName==='BUTTON'){el.disabled=true;el.style.opacity='0.55';}else el.disabled=true;});}
function render(v){
function expTabela(tipo){let h='',ls=[];if(tipo==='vei'){h='placa;modelo;marca;ano;cor;hodometro_atual';ls=S.vei.map(v=>[v.placa,v.modelo,v.marca,v.ano??'',v.cor,v.hodometro_atual??0].join(';'));}
if(tipo==='mot'){h='nome;cnh;categoria;validade_cnh;telefone';ls=S.mot.map(m=>[m.nome,m.cnh,m.categoria,m.validade_cnh,m.telefone].join(';'));}
if(tipo==='rot'){h='nome;origem;destino;km_estimado;tempo_estimado';ls=S.rot.map(r=>[r.nome,r.origem,r.destino,r.km_estimado??0,r.tempo_estimado].join(';'));}
dl(`${tipo}.csv`,[h,...ls].join('\n'),'text/csv');show('CSV exportado')}
function impTabela(tipo,txt){const ls=txt.split(/\r?\n/).filter(x=>x.trim());if(!ls.length)return;ls.shift();let arr=[];for(const ln of ls){const p=ln.split(';');if(tipo==='vei'&&p.length>=6)arr.push({placa:p[0],modelo:p[1],marca:p[2],ano:Number(p[3])||null,cor:p[4],hodometro_atual:Number(p[5])||0});if(tipo==='mot'&&p.length>=5)arr.push({nome:p[0],cnh:p[1],categoria:p[2],validade_cnh:p[3],telefone:p[4]});if(tipo==='rot'&&p.length>=5)arr.push({nome:p[0],origem:p[1],destino:p[2],km_estimado:Number(p[3])||0,tempo_estimado:p[4]});}
if(confirm('Adicionar ao existente? (Cancelar=substituir)')){if(tipo==='vei')S.vei=[...S.vei,...arr];if(tipo==='mot')S.mot=[...S.mot,...arr];if(tipo==='rot')S.rot=[...S.rot,...arr];}
else{if(tipo==='vei')S.vei=arr;if(tipo==='mot')S.mot=arr;if(tipo==='rot')S.rot=arr;}save();show('Importação concluída')}

document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.v===v)); if(v==='dash')dash(); if(v==='port')port(); if(v==='hist')hist(); if(v==='frota')frota(); if(v==='cond')cond(); if(v==='rotas')rotas(); if(v==='users')users(); if(v==='conf')conf(); $('side').classList.remove('open');aplicarSomenteVisualizacao()}

function dash(){const total=S.reg.length, fin=S.reg.filter(r=>r.tipo==='saida').length, p=patio().length, kmTot=S.reg.reduce((a,r)=>a+km(r),0); const ult=[...S.reg].sort((a,b)=>b.data_hora.localeCompare(a.data_hora)).slice(0,7);
$('view').innerHTML=`<h2>📊 Dashboard</h2><div class='cards'><div class='card'>Total<br><b>${total}</b></div><div class='card'>Km Rodado<br><b>${kmTot}</b></div><div class='card'>Finalizadas<br><b>${fin}</b></div><div class='card'>No Pátio<br><b>${p}</b></div></div><div class='row'><div class='wrap' style='flex:2'><h3>Registros por Dia (7 dias)</h3><canvas id='c1'></canvas></div><div class='wrap' style='flex:1'><h3>Tipos de Saída</h3><canvas id='c2'></canvas></div></div><div class='wrap'><h3>Últimos Registros</h3>${ult.length?`<table><tr><th>Data</th><th>Tipo</th><th>Placa</th><th>Motorista</th><th>Foto</th></tr>${ult.map(r=>`<tr><td>${new Date(r.data_hora).toLocaleString('pt-BR')}</td><td><span class='bad ${r.tipo}'>${r.tipo}</span></td><td>${r.placa}</td><td>${r.motorista}</td><td>${r.foto?`<button class='btn' onclick='foto("${r.id}")'>📷</button>`:'-'}</td></tr>`).join('')}`:'Nenhum registro encontrado'}</div>`; graficos();}
function graficos(){const ds=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);ds.push(d.toISOString().slice(0,10))}const ent=ds.map(d=>S.reg.filter(r=>r.data_hora.slice(0,10)===d&&(r.tipo==='entrada'||r.km_saida==null)).length), sai=ds.map(d=>S.reg.filter(r=>r.data_hora.slice(0,10)===d&&r.tipo==='saida').length);
chartBar?.destroy();chartBar=new Chart($('c1'),{type:'bar',data:{labels:ds.map(d=>d.split('-').reverse().join('/')),datasets:[{label:'Entradas',data:ent,backgroundColor:'#1565c0'},{label:'Saídas',data:sai,backgroundColor:'#2e7d32'}]}});
const tipos=['Cliente','Manutenção','Transferência','Outro'],vals=tipos.map(t=>S.reg.filter(r=>r.tipo==='saida'&&r.tipo_saida===t).length);chartPie?.destroy();chartPie=new Chart($('c2'),{type:'doughnut',data:{labels:tipos,datasets:[{data:vals}]}})}

function port(){$('view').innerHTML=`<h2>🚪 Portaria</h2><div class='row'><button class='btn a' onclick='modalEntrada()'>🟢 Registrar Entrada</button><button class='btn p' onclick='modalSaida()'>🔴 Registrar Saída</button></div>`}
const opt=(arr,key)=>arr.map(v=>`<option>${v[key]}</option>`).join('');
function modalEntrada(){if(!S.vei.length){$('mb').innerHTML=`<h3>Nenhum veículo cadastrado. Cadastre em Frota.</h3>`;$('m').classList.remove('hidden');return}
$('mb').innerHTML=`<h3>Registrar Entrada</h3><div class='grid'><label>Placa<select id='eplaca'><option value=''>Selecione</option>${opt(S.vei,'placa')}<option value='__nova'>Nova placa</option></select></label><input id='enova' class='hidden' placeholder='Nova placa'><label>Motorista<select id='emot'><option value=''>Selecione</option>${opt(S.mot,'nome')}<option value='__outro'>Outro</option></select></label><input id='eoutro' class='hidden' placeholder='Nome motorista'><label>Km Atual<input id='ekm' type='number'></label><label>Rota<select id='erota'><option value=''>-</option>${opt(S.rot,'nome')}</select></label><textarea id='eobs' placeholder='Observação'></textarea><input id='efoto' type='file' accept='image/*' capture='environment'><img id='eprev' class='hidden' style='max-width:150px'><div class='row'><button class='btn' onclick='fecharM()'>Cancelar</button><button class='btn p' onclick='salvaEntrada()'>Salvar</button></div></div>`;$('m').classList.remove('hidden');$('eplaca').onchange=e=>$('enova').classList.toggle('hidden',e.target.value!=='__nova');$('emot').onchange=e=>$('eoutro').classList.toggle('hidden',e.target.value!=='__outro');$('efoto').onchange=e=>prev(e.target.files[0],'eprev')}
function modalSaida(){const pt=patio(); if(!pt.length){show('Nenhum veículo no pátio',true);return} const placas=[...new Set(pt.map(r=>r.placa))];
$('mb').innerHTML=`<h3>Registrar Saída</h3><div class='grid'><label>Placa<select id='splaca'>${placas.map(p=>`<option>${p}</option>`)}</select></label><label>Motorista<input id='smot'></label><label>Km Atual<input id='skm' type='number'></label><label>Tipo de Saída<select id='stipo'><option>Cliente</option><option>Manutenção</option><option>Transferência</option><option>Outro</option></select></label><label>Rota<select id='srota'><option value=''>-</option>${opt(S.rot,'nome')}</select></label><textarea id='sobs' placeholder='Observação'></textarea><input id='sfoto' type='file' accept='image/*' capture='environment'><img id='sprev' class='hidden' style='max-width:150px'><div class='row'><button class='btn' onclick='fecharM()'>Cancelar</button><button class='btn p' onclick='salvaSaida()'>Salvar</button></div></div>`;$('m').classList.remove('hidden'); autoMot(); $('splaca').onchange=autoMot; $('sfoto').onchange=e=>prev(e.target.files[0],'sprev')}
function autoMot(){const p=$('splaca').value;const r=[...S.reg].sort((a,b)=>b.data_hora.localeCompare(a.data_hora)).find(x=>x.placa===p&&x.tipo==='entrada'&&x.km_saida==null);$('smot').value=r?r.motorista:''}
function prev(f,id){if(!f)return;const fr=new FileReader();fr.onload=()=>{$(id).src=fr.result;$(id).classList.remove('hidden')};fr.readAsDataURL(f)}
function pick(idSel,idTxt){return $(idSel).value==='__nova'||$(idSel).value==='__outro'?$(idTxt).value.trim():$(idSel).value}
function salvaEntrada(){const placa=pick('eplaca','enova').toUpperCase(),mot=pick('emot','eoutro'),kmv=Number($('ekm').value);if(!placa||!mot||!Number.isFinite(kmv)){show('Preencha campos obrigatórios',true);return}
const foto=$('eprev').src||''; S.reg.push({id:id(),data_hora:new Date().toISOString(),tipo:'entrada',placa,motorista:mot,km_entrada:kmv,km_saida:null,tipo_saida:null,rota:$('erota').value||null,foto,observacao:$('eobs').value||''}); save(); fecharM(); render('dash'); show('Entrada registrada');}
function salvaSaida(){const placa=$('splaca').value,mot=$('smot').value.trim(),kms=Number($('skm').value),tipo=$('stipo').value; if(!placa||!mot||!Number.isFinite(kms)||!tipo){show('Campos obrigatórios',true);return}
const r=[...S.reg].sort((a,b)=>b.data_hora.localeCompare(a.data_hora)).find(x=>x.placa===placa&&x.tipo==='entrada'&&x.km_saida==null); const foto=$('sprev').src||'';
if(r){r.tipo='saida';r.km_saida=kms;r.tipo_saida=tipo;r.rota=$('srota').value||null;r.observacao=$('sobs').value||r.observacao;if(foto)r.foto=foto;r.data_hora=new Date().toISOString();}
else S.reg.push({id:id(),data_hora:new Date().toISOString(),tipo:'saida',placa,motorista:mot,km_entrada:null,km_saida:kms,tipo_saida:tipo,rota:$('srota').value||null,foto,observacao:$('sobs').value||''});
const v=S.vei.find(x=>x.placa===placa); if(v&&kms>Number(v.hodometro_atual||0)) v.hodometro_atual=kms; save(); fecharM(); render('dash'); show('Saída registrada');}
function fecharM(){$('m').classList.add('hidden')}

function foto(rid){const r=S.reg.find(x=>x.id===rid); if(!r||!r.foto)return; $('fotoBig').src=r.foto; $('fotoM').classList.remove('hidden')}
$('fotoM').onclick=e=>{if(e.target.id==='fotoM'||e.target.id==='fx')$('fotoM').classList.add('hidden')}

function hist(){const regs=[...S.reg].filter(r=>(S.f==='todos'||r.tipo===S.f)&&(`${r.placa} ${r.motorista}`.toLowerCase().includes(S.q.toLowerCase()))).sort((a,b)=>b.data_hora.localeCompare(a.data_hora));
$('view').innerHTML=`<h2>📋 Histórico</h2><div class='row'><button class='btn ${S.f==='todos'?'p':''}' onclick='S.f="todos";hist()'>Todos</button><button class='btn ${S.f==='entrada'?'p':''}' onclick='S.f="entrada";hist()'>Entradas</button><button class='btn ${S.f==='saida'?'p':''}' onclick='S.f="saida";hist()'>Saídas</button><input placeholder='Pesquisar placa ou motorista' value='${S.q}' oninput='S.q=this.value;hist()'></div><div class='wrap'>${regs.length?`<table><tr><th>Data</th><th>Tipo</th><th>Placa</th><th>Motorista</th><th>KmE</th><th>KmS</th><th>Km</th><th>Tipo Saída</th><th>Rota</th><th>Foto</th><th>Ações</th></tr>${regs.map(r=>`<tr><td>${new Date(r.data_hora).toLocaleString('pt-BR')}</td><td><span class='bad ${r.tipo}'>${r.tipo}</span></td><td>${r.placa}</td><td>${r.motorista}</td><td>${r.km_entrada??'-'}</td><td>${r.km_saida??'-'}</td><td>${km(r)||'-'}</td><td>${r.tipo_saida||'-'}</td><td>${r.rota||'-'}</td><td>${r.foto?`<button class='btn' onclick='foto("${r.id}")'>📷</button>`:'-'}</td><td><button class='btn d' onclick='delReg("${r.id}")'>🗑️</button></td></tr>`).join('')}</table>`:'Nenhum registro encontrado'}</div>`}
function delReg(i){if(confirm('Excluir registro?')){S.reg=S.reg.filter(r=>r.id!==i);save();hist();show('Registro excluído')}}

function frota(){ $('view').innerHTML=`<h2>🚛 Frota</h2><button class='btn p' onclick='modalV()'>+ Novo Veículo</button><div class='wrap'>${S.vei.length?`<table><tr><th>Placa</th><th>Modelo</th><th>Marca</th><th>Ano</th><th>Cor</th><th>Hodômetro</th><th>Ações</th></tr>${S.vei.map(v=>`<tr><td>${v.placa}</td><td>${v.modelo||''}</td><td>${v.marca||''}</td><td>${v.ano||''}</td><td>${v.cor||''}</td><td>${v.hodometro_atual||0}</td><td><button class='btn' onclick='modalV("${v.placa}")'>✏️</button><button class='btn d' onclick='delV("${v.placa}")'>🗑️</button></td></tr>`).join('')}</table>`:'Nenhum veículo cadastrado'}</div>`}
function modalV(p=''){const v=S.vei.find(x=>x.placa===p)||{};$('mb').innerHTML=`<h3>${p?'Editar':'Novo'} Veículo</h3><div class='grid'><input id='vplaca' placeholder='Placa' value='${v.placa||''}' ${p?'disabled':''}><input id='vmod' placeholder='Modelo' value='${v.modelo||''}'><input id='vmar' placeholder='Marca' value='${v.marca||''}'><input id='vano' type='number' placeholder='Ano' value='${v.ano||''}'><input id='vcor' placeholder='Cor' value='${v.cor||''}'><input id='vhod' type='number' placeholder='Hodômetro' value='${v.hodometro_atual||0}'><div class='row'><button class='btn' onclick='fecharM()'>Cancelar</button><button class='btn p' onclick='saveV("${p}")'>Salvar</button></div></div>`;$('m').classList.remove('hidden')}
function saveV(old){const placa=$('vplaca').value.trim().toUpperCase(); if(!placa){show('Placa obrigatória',true);return} if(!old&&S.vei.some(v=>v.placa===placa)){show('Placa já existe',true);return}
const obj={placa,modelo:$('vmod').value,marca:$('vmar').value,ano:Number($('vano').value)||null,cor:$('vcor').value,hodometro_atual:Number($('vhod').value)||0}; if(old)S.vei=S.vei.map(v=>v.placa===old?obj:v); else S.vei.push(obj); save();fecharM();frota();show('Veículo salvo')}
function delV(p){if(confirm('Excluir veículo?')){S.vei=S.vei.filter(v=>v.placa!==p);save();frota()}}

function cond(){ $('view').innerHTML=`<h2>👤 Condutores</h2><button class='btn p' onclick='modalM()'>+ Novo Condutor</button><div class='wrap'>${S.mot.length?`<table><tr><th>Nome</th><th>CNH</th><th>Categoria</th><th>Validade</th><th>Telefone</th><th>Ações</th></tr>${S.mot.map(m=>`<tr><td>${m.nome}</td><td>${m.cnh||''}</td><td>${m.categoria||''}</td><td>${m.validade_cnh||''}</td><td>${m.telefone||''}</td><td><button class='btn' onclick='modalM("${m.nome}")'>✏️</button><button class='btn d' onclick='delM("${m.nome}")'>🗑️</button></td></tr>`).join('')}</table>`:'Nenhum condutor cadastrado'}</div>`}
function modalM(n=''){const m=S.mot.find(x=>x.nome===n)||{};$('mb').innerHTML=`<h3>${n?'Editar':'Novo'} Condutor</h3><div class='grid'><input id='mn' placeholder='Nome' value='${m.nome||''}'><input id='mcnh' placeholder='CNH' value='${m.cnh||''}'><input id='mcat' placeholder='Categoria' value='${m.categoria||''}'><input id='mval' type='date' value='${m.validade_cnh||''}'><input id='mtel' placeholder='Telefone' value='${m.telefone||''}'><div class='row'><button class='btn' onclick='fecharM()'>Cancelar</button><button class='btn p' onclick='saveM("${n}")'>Salvar</button></div></div>`;$('m').classList.remove('hidden')}
function saveM(old){const nome=$('mn').value.trim(); if(!nome){show('Nome obrigatório',true);return} const o={nome,cnh:$('mcnh').value,categoria:$('mcat').value,validade_cnh:$('mval').value,telefone:$('mtel').value}; if(old)S.mot=S.mot.map(m=>m.nome===old?o:m); else S.mot.push(o); save();fecharM();cond();show('Condutor salvo')} function delM(n){if(confirm('Excluir condutor?')){S.mot=S.mot.filter(m=>m.nome!==n);save();cond()}}

function rotas(){ $('view').innerHTML=`<h2>🗺️ Rotas</h2><button class='btn p' onclick='modalR()'>+ Nova Rota</button><div class='wrap'>${S.rot.length?`<table><tr><th>Nome</th><th>Origem</th><th>Destino</th><th>Km</th><th>Tempo</th><th>Ações</th></tr>${S.rot.map(r=>`<tr><td>${r.nome}</td><td>${r.origem||''}</td><td>${r.destino||''}</td><td>${r.km_estimado||0}</td><td>${r.tempo_estimado||''}</td><td><button class='btn' onclick='modalR("${r.nome}")'>✏️</button><button class='btn d' onclick='delR("${r.nome}")'>🗑️</button></td></tr>`).join('')}</table>`:'Nenhuma rota cadastrada'}</div>`}
function modalR(n=''){const r=S.rot.find(x=>x.nome===n)||{};$('mb').innerHTML=`<h3>${n?'Editar':'Nova'} Rota</h3><div class='grid'><input id='rn' placeholder='Nome' value='${r.nome||''}'><input id='ro' placeholder='Origem' value='${r.origem||''}'><input id='rd' placeholder='Destino' value='${r.destino||''}'><input id='rkm' type='number' placeholder='Km estimado' value='${r.km_estimado||0}'><input id='rt' placeholder='Tempo estimado' value='${r.tempo_estimado||''}'><div class='row'><button class='btn' onclick='fecharM()'>Cancelar</button><button class='btn p' onclick='saveR("${n}")'>Salvar</button></div></div>`;$('m').classList.remove('hidden')}
function saveR(old){const nome=$('rn').value.trim(); if(!nome){show('Nome obrigatório',true);return} if(!old&&S.rot.some(r=>r.nome===nome)){show('Nome já existe',true);return} const o={nome,origem:$('ro').value,destino:$('rd').value,km_estimado:Number($('rkm').value)||0,tempo_estimado:$('rt').value}; if(old)S.rot=S.rot.map(r=>r.nome===old?o:r); else S.rot.push(o); save();fecharM();rotas();show('Rota salva')} function delR(n){if(confirm('Excluir rota?')){S.rot=S.rot.filter(r=>r.nome!==n);save();rotas()}}


function users(){ $('view').innerHTML=`<h2>🛂 Porteiros</h2><div class='wrap'><h3>Criar Usuário</h3><div class='row'><input id='uNomeNovo' placeholder='Usuário (nome)'><input id='uSenhaNova' type='password' placeholder='Senha'><select id='uPerfilNovo'><option value='porteiro'>Porteiro</option><option value='admin'>Administrativo</option></select><button class='btn p' onclick='criarUsuarioRapido()'>Salvar Usuário</button></div></div><button class='btn p' onclick='modalU()'>+ Novo Usuário</button><div class='wrap'>${S.usr.length?`<table><tr><th>Usuário</th><th>Perfil</th><th>Senha</th><th>Ações</th></tr>${S.usr.map(u=>`<tr><td>${u.nome}</td><td>${u.perfil||'porteiro'}</td><td>••••••</td><td><button class='btn' onclick='modalU("${u.nome}")'>✏️</button><button class='btn d' onclick='delU("${u.nome}")'>🗑️</button></td></tr>`).join('')}</table>`:'Nenhum porteiro cadastrado'}</div>`}
function modalU(n=''){const u=S.usr.find(x=>x.nome===n)||{};$('mb').innerHTML=`<h3>${n?'Editar':'Novo'} Porteiro</h3><div class='grid'><input id='un' placeholder='Nome' value='${u.nome||''}'><input id='us' placeholder='Senha' value='${u.senha||''}'><select id='up'><option value='porteiro' ${(u.perfil||'porteiro')==='porteiro'?'selected':''}>Porteiro</option><option value='admin' ${(u.perfil||'')==='admin'?'selected':''}>Administrativo</option></select><div class='row'><button class='btn' onclick='fecharM()'>Cancelar</button><button class='btn p' onclick='saveU("${n}")'>Salvar</button></div></div>`;$('m').classList.remove('hidden')}
function saveU(old){const nome=$('un').value.trim(),senha=$('us').value.trim();if(!nome||!senha){show('Nome e senha obrigatórios',true);return}if(!old&&S.usr.some(u=>u.nome===nome)){show('Nome já existe',true);return}const o={nome,senha,perfil:$('up').value};if(old)S.usr=S.usr.map(u=>u.nome===old?o:u);else S.usr.push(o);save();fecharM();users();show('Usuário salvo')}
function criarUsuarioRapido(){const nome=$('uNomeNovo').value.trim(),senha=$('uSenhaNova').value.trim(),perfil=$('uPerfilNovo').value;if(!nome||!senha){show('Usuário e senha obrigatórios',true);return}if(S.usr.some(u=>u.nome===nome)){show('Usuário já existe',true);return}S.usr.push({nome,senha,perfil});save();show('Usuário criado');users()}
function delU(n){if(confirm('Excluir usuário?')){S.usr=S.usr.filter(u=>u.nome!==n);save();users()}}
function conf(){ $('view').innerHTML=`<h2>⚙️ Configurações</h2><div class='wrap'><h3>Modelos de Importação</h3><label>Escolha o tipo para ver o modelo:</label><select id='modeloSel'><option value='json'>JSON Completo</option><option value='reg'>CSV Registros</option><option value='vei'>CSV Frota</option><option value='mot'>CSV Condutores</option><option value='rot'>CSV Rotas</option></select><div id='modeloBox' style='margin-top:8px;font-size:14px;line-height:1.4'></div></div><div class='row'><button class='btn p' onclick='expJSON()'>Exportar Todos JSON</button><label class='btn a'>Importar Dados JSON<input id='ij' hidden type='file' accept='.json'></label><button class='btn p' onclick='expCSV()'>Exportar Registros CSV</button><label class='btn a'>Importar Registros CSV<input id='ic' hidden type='file' accept='.csv,.txt'></label><button class='btn p' onclick='expTabela("vei")'>Exportar Frota CSV</button><label class='btn a'>Importar Frota CSV<input id='iv' hidden type='file' accept='.csv,.txt'></label><button class='btn p' onclick='expTabela("mot")'>Exportar Condutores CSV</button><label class='btn a'>Importar Condutores CSV<input id='im' hidden type='file' accept='.csv,.txt'></label><button class='btn p' onclick='expTabela("rot")'>Exportar Rotas CSV</button><label class='btn a'>Importar Rotas CSV<input id='ir' hidden type='file' accept='.csv,.txt'></label><button class='btn d' onclick='wipe()'>Limpar Todos os Dados</button></div>`;
$('ij').onchange=async e=>impJSON(await e.target.files[0].text()); $('ic').onchange=async e=>impCSV(await e.target.files[0].text()); $('iv').onchange=async e=>impTabela('vei',await e.target.files[0].text()); $('im').onchange=async e=>impTabela('mot',await e.target.files[0].text()); $('ir').onchange=async e=>impTabela('rot',await e.target.files[0].text());const modelos={json:'Objeto JSON com chaves: veiculos[], motoristas[], rotas[], registros[].',reg:'CSV Registros: A=id; B=data_hora(ISO); C=tipo(entrada/saida); D=placa; E=motorista; F=km_entrada; G=km_saida; H=tipo_saida; I=rota; J=foto(base64).',vei:'CSV Frota: A=placa; B=modelo; C=marca; D=ano; E=cor; F=hodometro_atual.',mot:'CSV Condutores: A=nome; B=cnh; C=categoria; D=validade_cnh (YYYY-MM-DD); E=telefone.',rot:'CSV Rotas: A=nome; B=origem; C=destino; D=km_estimado; E=tempo_estimado.'};const upd=()=>$('modeloBox').innerHTML='<b>Formato:</b> '+modelos[$('modeloSel').value];$('modeloSel').onchange=upd;upd();}
function dl(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}
function expJSON(){dl('portaria_dados.json',JSON.stringify({veiculos:S.vei,motoristas:S.mot,rotas:S.rot,registros:S.reg},null,2),'application/json');show('JSON exportado')}
function impJSON(txt){try{const o=JSON.parse(txt); if(confirm('Adicionar aos dados atuais? (Cancelar = substituir tudo)')){S.vei=[...S.vei,...(o.veiculos||[])];S.mot=[...S.mot,...(o.motoristas||[])];S.rot=[...S.rot,...(o.rotas||[])];S.reg=[...S.reg,...(o.registros||[])]} else {S.vei=o.veiculos||[];S.mot=o.motoristas||[];S.rot=o.rotas||[];S.reg=o.registros||[]} save();show('Importação JSON concluída')}catch{show('JSON inválido',true)}}
function expCSV(){const h='id;data_hora;tipo;placa;motorista;km_entrada;km_saida;tipo_saida;rota;foto';const l=S.reg.map(r=>[r.id,r.data_hora,r.tipo,r.placa,r.motorista,r.km_entrada??'',r.km_saida??'',r.tipo_saida??'',r.rota??'',r.foto??''].join(';'));dl('registros.csv',[h,...l].join('\n'),'text/csv');show('CSV exportado')}
function impCSV(txt){const ls=txt.split(/\r?\n/).filter(x=>x.trim()); if(!ls.length){show('CSV vazio',true);return} ls.shift(); const arr=[]; for(const ln of ls){const p=ln.split(';'); if(p.length<10) continue; const [id_,dh,t,pl,m,ke,ks,ts,ro,fo]=p; if(!id_||!dh||!['entrada','saida'].includes(t)||!pl||!m) continue; arr.push({id:id_,data_hora:dh,tipo:t,placa:pl,motorista:m,km_entrada:ke===''?null:Number(ke),km_saida:ks===''?null:Number(ks),tipo_saida:ts||null,rota:ro||null,foto:fo||'',observacao:''})}
if(!arr.length){show('Nenhuma linha válida',true);return} if(confirm('Adicionar ao existente? (Cancelar=substituir)'))S.reg=[...S.reg,...arr]; else S.reg=arr; save();show('CSV importado')}
function wipe(){if(!confirm('Tem certeza? Isso não pode ser desfeito.'))return;if(!confirm('Confirma novamente?'))return;localStorage.removeItem(K.reg);localStorage.removeItem(K.vei);localStorage.removeItem(K.mot);localStorage.removeItem(K.rot);load();save();show('Dados limpos');render('dash')}


function expTabela(tipo){let h='',ls=[];if(tipo==='vei'){h='placa;modelo;marca;ano;cor;hodometro_atual';ls=S.vei.map(v=>[v.placa,v.modelo,v.marca,v.ano??'',v.cor,v.hodometro_atual??0].join(';'));}
if(tipo==='mot'){h='nome;cnh;categoria;validade_cnh;telefone';ls=S.mot.map(m=>[m.nome,m.cnh,m.categoria,m.validade_cnh,m.telefone].join(';'));}
if(tipo==='rot'){h='nome;origem;destino;km_estimado;tempo_estimado';ls=S.rot.map(r=>[r.nome,r.origem,r.destino,r.km_estimado??0,r.tempo_estimado].join(';'));}
dl(`${tipo}.csv`,[h,...ls].join('\n'),'text/csv');show('CSV exportado')}
function impTabela(tipo,txt){const ls=txt.split(/\r?\n/).filter(x=>x.trim());if(!ls.length)return;ls.shift();let arr=[];for(const ln of ls){const p=ln.split(';');if(tipo==='vei'&&p.length>=6)arr.push({placa:p[0],modelo:p[1],marca:p[2],ano:Number(p[3])||null,cor:p[4],hodometro_atual:Number(p[5])||0});if(tipo==='mot'&&p.length>=5)arr.push({nome:p[0],cnh:p[1],categoria:p[2],validade_cnh:p[3],telefone:p[4]});if(tipo==='rot'&&p.length>=5)arr.push({nome:p[0],origem:p[1],destino:p[2],km_estimado:Number(p[3])||0,tempo_estimado:p[4]});}if(confirm('Adicionar ao existente? (Cancelar=substituir)')){if(tipo==='vei')S.vei=[...S.vei,...arr];if(tipo==='mot')S.mot=[...S.mot,...arr];if(tipo==='rot')S.rot=[...S.rot,...arr];}else{if(tipo==='vei')S.vei=arr;if(tipo==='mot')S.mot=arr;if(tipo==='rot')S.rot=arr;}save();show('Importação concluída')}

document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>render(b.dataset.v)); $('hamb').onclick=()=>$('side').classList.toggle('open'); $('m').onclick=e=>{if(e.target.id==='m')fecharM()}; init();
</script></body></html>
